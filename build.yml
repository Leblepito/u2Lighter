name: u2Lighter Build Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'design_pack/**'
      - 'pipeline/**'
  workflow_dispatch:
    inputs:
      figure_id:
        description: 'Figure ID to build (e.g., panter_v2)'
        required: true
        type: string
      run_render:
        description: 'Run render pipeline'
        type: boolean
        default: true
      run_marketing:
        description: 'Run marketing asset export'
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.12'
  BL_VERSION: '5.1'

jobs:
  geometry:
    name: Geometry Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      figure_id: ${{ steps.extract_figure_id.outputs.figure_id }}
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pipeline/geometry/requirements.txt

      - name: Install Python dependencies
        run: |
          cd pipeline/geometry
          pip install -r requirements.txt

      - name: Determine figure_id
        id: extract_figure_id
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FIGURE_ID="${{ github.event.inputs.figure_id }}"
          else
            # Find changed design_pack files
            CHANGED=$(git diff --name-only HEAD~1..HEAD | grep '^design_pack/.*\.json$' | head -1)
            FIGURE_ID=$(basename "$CHANGED" .json)
          fi
          echo "figure_id=$FIGURE_ID" >> $GITHUB_OUTPUT
          echo "Building figure: $FIGURE_ID"

      - name: Extract version from design pack
        id: extract_version
        run: |
          FIGURE_ID="${{ steps.extract_figure_id.outputs.figure_id }}"
          VERSION=$(jq -r '.figure_id' "design_pack/${FIGURE_ID}.json" | sed 's/.*_v//')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Run geometry pipeline
        run: |
          cd pipeline/geometry
          export PYTHONIOENCODING=utf-8
          python run_all.py --design-pack ../design_pack/${{ steps.extract_figure_id.outputs.figure_id }}.json

      - name: Upload geometry artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geometry-${{ steps.extract_figure_id.outputs.figure_id }}
          path: |
            output/print/
            output/report/
          retention-days: 90

      - name: Upload variant comparison
        uses: actions/upload-artifact@v4
        with:
          name: variant-comparison-${{ steps.extract_figure_id.outputs.figure_id }}
          path: output/report/variant_comparison.json
          retention-days: 90

  render:
    name: Render Pipeline
    runs-on: ubuntu-latest
    needs: geometry
    if: ${{ github.event.inputs.run_render != 'false' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download geometry artifacts
        uses: actions/download-artifact@v4
        with:
          name: geometry-${{ needs.geometry.outputs.figure_id }}
          path: output/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pipeline/render/requirements.txt

      - name: Install Python dependencies
        run: |
          cd pipeline/render
          pip install -r requirements.txt

      - name: Install Blender
        uses: jidicula/blender-action@v2
        with:
          version: ${{ env.BL_VERSION }}
          platform: linux

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run render pipeline - test mode
        run: |
          cd pipeline/render
          FIGURE_ID="${{ needs.geometry.outputs.figure_id }}"
          BLENDER_EXE="blender"
          export BLENDER_EXE
          python turntable.py --scene case --mode test --pct 33 --samples 64 --case ../geometry/output/print/${FIGURE_ID}.3mf

      - name: Run render pipeline - stills
        run: |
          cd pipeline/render
          FIGURE_ID="${{ needs.geometry.outputs.figure_id }}"
          python turntable.py --scene case --mode stills --samples 512 --case ../geometry/output/print/${FIGURE_ID}.3mf

      - name: Run render pipeline - frames
        run: |
          cd pipeline/render
          FIGURE_ID="${{ needs.geometry.outputs.figure_id }}"
          python turntable.py --scene case --mode frames --samples 160 --noise 0.02 --case ../geometry/output/print/${FIGURE_ID}.3mf

      - name: Encode video
        run: |
          cd pipeline/render
          python encode.py

      - name: Upload render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ needs.geometry.outputs.figure_id }}
          path: |
            output/video/
            output/stills/
          retention-days: 90

  marketing:
    name: Marketing Assets
    runs-on: ubuntu-latest
    needs: [geometry, render]
    if: ${{ github.event.inputs.run_marketing != 'false' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download geometry artifacts
        uses: actions/download-artifact@v4
        with:
          name: geometry-${{ needs.geometry.outputs.figure_id }}
          path: output/

      - name: Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: render-${{ needs.geometry.outputs.figure_id }}
          path: output/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pipeline/render/requirements.txt

      - name: Install Python dependencies
        run: |
          cd pipeline/render
          pip install -r requirements.txt

      - name: Install Node.js for gltf-transform
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gltf-transform
        run: npm install -g @gltf-transform/cli

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Export marketing assets
        run: |
          cd pipeline/render
          FIGURE_ID="${{ needs.geometry.outputs.figure_id }}"
          python export_marketing.py \
            --case ../geometry/output/print/${FIGURE_ID}.3mf \
            --stills ../geometry/output/stills/ \
            --video ../geometry/output/video/${FIGURE_ID}_360.mp4 \
            --figure-id ${FIGURE_ID} \
            --output-dir ../geometry/output/marketing/${FIGURE_ID} \
            --qr-base-url https://u2lighter.com/ar/

      - name: Upload marketing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketing-${{ needs.geometry.outputs.figure_id }}
          path: output/marketing/
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [geometry, render, marketing]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Prepare release assets
        id: prep_assets
        run: |
          FIGURE_ID="${{ needs.geometry.outputs.figure_id }}"
          VERSION="${{ needs.geometry.outputs.version }}"
          ASSET_DIR="artifacts/${FIGURE_ID}"
          mkdir -p "$ASSET_DIR"
          
          # Collect all assets
          find artifacts -name "*.3mf" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "*.stl" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "*.mp4" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "*.glb" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "*.usdz" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "*.png" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "*.html" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "variant_comparison.json" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "case_v2_validation.json" -exec cp {} "$ASSET_DIR/" \;
          find artifacts -name "stand_params.json" -exec cp {} "$ASSET_DIR/" \;
          
          echo "asset_dir=$ASSET_DIR" >> $GITHUB_OUTPUT
          ls -la "$ASSET_DIR/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push'
        with:
          tag_name: ${{ needs.geometry.outputs.figure_id }}-${{ needs.geometry.outputs.version }}
          name: ${{ needs.geometry.outputs.figure_id }} ${{ needs.geometry.outputs.version }}
          body: |
            ## u2Lighter ${{ needs.geometry.outputs.figure_id }} Release
            
            ### Assets Included
            - **Print files**: STL, 3MF for 3D printing
            - **Video**: Turntable MP4 (360°)
            - **Stills**: Hero renders (front, 3-4, side, back)
            - **Web/AR**: GLB (Draco compressed), USDZ, viewer.html
            - **Social**: Reels (9:16), Post (1:1), Portrait (4:5)
            - **QR Code**: Links to AR viewer
            - **Reports**: Variant comparison, validation reports
            
            Generated from design pack: `design_pack/${{ needs.geometry.outputs.figure_id }}.json`
          files: ${{ steps.prep_assets.outputs.asset_dir }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const figure_id = "${{ needs.geometry.outputs.figure_id }}";
            const run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            // In production, use a secret for the webhook URL
            console.log(`Build failed for ${figure_id}. Run: ${run_url}`);
            // Example: await fetch('${{ secrets.TELEGRAM_WEBHOOK_URL }}', { method: 'POST', body: JSON.stringify({ text: `❌ Build failed for ${figure_id}` }) });