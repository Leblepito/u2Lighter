name: u2Lighter Build Pipeline

# Geometry -> Blender render -> marketing assets, for one design pack.
# Runner: GitHub-hosted ubuntu-latest by default. To use a self-hosted Blender machine,
# set the repository variable BLENDER_RUNNER (Settings -> Variables -> Actions) to "self-hosted".
# Requires the figure's source 3MF to be available (work/3mf/ is git-ignored).
on:
  workflow_dispatch:
    inputs:
      figure_id:
        description: 'Figure ID to build (design_pack/<figure_id>.json, e.g. wolf_v1)'
        required: true
        type: string
      run_render:
        description: 'Run render pipeline'
        type: boolean
        default: true
      run_marketing:
        description: 'Run marketing asset export'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  BL_VERSION: '5.1.0'
  BL_SERIES: '5.1'
  FIGURE_ID: ${{ inputs.figure_id }}

jobs:
  geometry:
    name: Geometry Pipeline
    runs-on: ${{ vars.BLENDER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Check design pack
        run: test -f "design_pack/${FIGURE_ID}.json" || { echo "design_pack/${FIGURE_ID}.json not found"; exit 1; }

      - name: Run geometry pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python load_design_pack.py "design_pack/${FIGURE_ID}.json"
          python analyze_case.py
          python build_case_v2.py --skip-selfint --no-render
          python build_stand.py
          python make_report.py

      - name: Upload geometry artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geometry-${{ env.FIGURE_ID }}
          path: |
            output/print/
            output/report/
          retention-days: 90

  render:
    name: Render Pipeline (Blender)
    runs-on: ${{ vars.BLENDER_RUNNER || 'ubuntu-latest' }}
    needs: geometry
    if: ${{ inputs.run_render }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download geometry artifacts
        uses: actions/download-artifact@v4
        with:
          name: geometry-${{ env.FIGURE_ID }}
          path: output/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Install Blender + ffmpeg
        run: |
          if [ -n "$BLENDER_EXE" ] && [ -x "$BLENDER_EXE" ]; then echo "Using existing Blender: $BLENDER_EXE"; exit 0; fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6
          wget -q "https://download.blender.org/release/Blender${BL_SERIES}/blender-${BL_VERSION}-linux-x64.tar.xz"
          tar -xf "blender-${BL_VERSION}-linux-x64.tar.xz"
          echo "BLENDER_EXE=$PWD/blender-${BL_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Render - test, stills, frames
        run: |
          CASE="output/print/${FIGURE_ID}.3mf"
          python turntable.py --scene case --mode test --pct 33 --samples 64 --case "$CASE"
          python turntable.py --scene case --mode stills --samples 512 --case "$CASE"
          python turntable.py --scene case --mode frames --samples 160 --noise 0.02 --case "$CASE"

      - name: Encode video
        run: python encode.py

      - name: Upload render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ env.FIGURE_ID }}
          path: |
            output/video/
            output/stills/
          retention-days: 90

  marketing:
    name: Marketing Assets
    runs-on: ubuntu-latest
    needs: [geometry, render]
    if: ${{ inputs.run_marketing }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download geometry artifacts
        uses: actions/download-artifact@v4
        with:
          name: geometry-${{ env.FIGURE_ID }}
          path: output/

      - name: Download render artifacts
        uses: actions/download-artifact@v4
        with:
          name: render-${{ env.FIGURE_ID }}
          path: output/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements-pipeline.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install -g @gltf-transform/cli

      - name: Export marketing assets
        run: |
          python export_marketing.py \
            --case "output/print/${FIGURE_ID}.3mf" \
            --stills output/stills/ \
            --video "output/video/${FIGURE_ID}_360.mp4" \
            --figure-id "${FIGURE_ID}" \
            --output-dir "output/marketing/${FIGURE_ID}" \
            --qr-base-url https://u2lighter.com/ar/

      - name: Upload marketing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketing-${{ env.FIGURE_ID }}
          path: output/marketing/
          retention-days: 90
